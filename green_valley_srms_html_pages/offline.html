<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f5138">
    <title>Offline — Green Valley SRMS</title>
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <!-- Styles are inlined so this page looks right even with no network. -->
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1b2a24;
            background:
                radial-gradient(1100px 520px at 15% -10%, rgba(47,125,84,.16), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(201,138,43,.14), transparent 55%),
                #f2f4ef;
        }
        .box {
            background: #fff;
            width: 420px;
            max-width: 100%;
            padding: 36px 34px;
            border-radius: 16px;
            border: 1px solid #e3e7df;
            box-shadow: 0 24px 60px -28px rgba(20,45,32,.45);
            text-align: center;
            position: relative;
        }
        .box::before {
            content: "";
            position: absolute; left: 34px; right: 34px; top: 0;
            height: 3px; border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, #1f5138, #c98a2b);
        }
        .crest {
            width: 56px; height: 56px;
            margin: 6px auto 18px;
            border-radius: 14px;
            display: grid; place-items: center;
            background: #1f5138;
            color: #c98a2b;
            font-weight: 800; font-size: 20px; letter-spacing: .02em;
        }
        h1 { font-size: 1.3rem; margin-bottom: 8px; }
        p { color: #5c6b63; font-size: .95rem; line-height: 1.55; margin-bottom: 8px; }
        .hint { font-size: .82rem; color: #80908a; margin-top: 14px; }
        button {
            margin-top: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            background: #1f5138; color: #fff;
            border: 1px solid #1f5138;
            padding: 11px 22px;
            font: inherit; font-weight: 600; font-size: .9rem;
            border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #163b28; border-color: #163b28; }
    </style>
</head>
<body>
    <main class="box">
        <div class="crest" aria-hidden="true">GV</div>
        <h1>You're offline</h1>
        <p>The Green Valley Records System needs a connection to the school
           server to load live student data.</p>
        <p>Pages you opened recently may still be available — use the menu to
           go back to one of them.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <p class="hint">Green Valley Secondary School · Murang'a County</p>
    </main>
</body>
</html>
